[package]
name = "bike_w_friends"
version = "0.1.0"
edition = "2021"

[dependencies]
defmt = "0.3"
defmt-rtt = "0.4"
panic-probe = { version = "0.3", features = ["print-defmt"] }
embedded-hal = "1.0.0"
# RP2350 (Raspberry Pi Pico 2). For the original Pico (RP2040) use rp-pico instead.
rp235x-hal = { version = "0.4", features = [
    "rt",
    "critical-section-impl",
    "binary-info",
] }
cortex-m = "0.7"
cortex-m-rt = "0.7"
ssd1306 = "0.9.0"
embedded-graphics = "0.8.1"
heapless = "0.8.0"
critical-section = "1.1.3"
tinybmp = "0.6.0"
embedded-graphics-framebuf = "0.5.0"

# cargo build/run
[profile.dev]
codegen-units = 1
debug = 2
debug-assertions = true
incremental = false
opt-level = 3
overflow-checks = true

# cargo build/run --release
[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 3
overflow-checks = false

# do not optimize proc-macro crates = faster builds from scratch
[profile.dev.build-override]
codegen-units = 8
debug = false
debug-assertions = false
opt-level = 0
overflow-checks = false

[profile.release.build-override]
codegen-units = 8
debug = false
debug-assertions = false
opt-level = 0
overflow-checks = false

# cargo test
[profile.test]
codegen-units = 1
debug = 2
debug-assertions = true
incremental = false
opt-level = 3
overflow-checks = true

# cargo test --release
[profile.bench]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 3
